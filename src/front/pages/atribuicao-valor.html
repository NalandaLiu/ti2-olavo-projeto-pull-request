<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/atribuicao-valor-novo.css">
    <link rel="stylesheet" href="../assets/css/aside.css">
    <link rel="stylesheet" href="../assets/css/buttons.css">
    <link rel="stylesheet" href="../assets/css/css_reset.css">
    <link rel="stylesheet" href="../assets/css/inputs.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Mastercar</title>
</head>
<body>
    <section class="tela">
        <aside class="sidebar">
            <a href="./perfil.html">
                <i class="fas fa-user icon"></i>
            </a>
            <a href="./menu-vendas.html">
                <i class="fas fa-handshake icon"></i>
            </a>
            <a href="./veiculos.html">
                <i class="fas fa-car icon"></i>
            </a>
            <a href="./metricas.html"><i class="fa-solid fa-chart-line icon"></i></a>
        </aside>
        <main>
            <div class="venda-id" id="venda-id">
                <h2 class="pagina-titulo">Atribuição de valor</h2>
                <!--Informacoes do veiculo-->
                
                <h2 class="page-title">Informações do veículo</h2>
                <section class="vehicle-info">
                    <div class="info">
                        <h2 class="info-title">Chassis: </h2>
                        <p class="info-value" id="chassis">123456789101234567</p>
                    </div>
                    <div class="info">
                        <h2 class="info-title">Placa: </h2>
                        <p class="info-value" id="placa">ABC1234</p>
                    </div>
                    <div class="info">
                        <h2 class="info-title">Marca: </h2>
                        <p class="info-value" id="marca">Fiat</p>
                    </div>
                    <div class="info">
                        <h2 class="info-title">Modelo: </h2>
                        <p class="info-value" id="modelo">Uno</p>
                    </div>
                    <div class="info">
                        <h2 class="info-title">Ano: </h2>
                        <p class="info-value" id="ano">2002</p>
                    </div>
                    <div class="info">
                        <h2 class="info-title">Estado: </h2>
                        <p class="info-value" id="estado">Novo</p>
                    </div>
                    <div class="info">
                        <h2 class="info-title">Quilometragem: </h2>
                        <p class="info-value" id="quilometragem">0</p>
                    </div>
                    <div class="info">
                        <h2 class="info-title">Preço: </h2>
                        <p class="info-value" id="preco">R$20000,00</p>
                    </div>
                </section>
                <!--Secao com os campos-->
                <section class="fields">
                    <!--Campos de valor-->
                    <div class="numerical-fields campo">
                        <div class="valor-venda" id="valor-field">
                            <h2 class="page-title">Valor da venda</h2>
                            <input type="number" name="valor-venda" id="valor-venda">
                        </div>
                        <div class="desconto" id="desconto-field">
                            <h2 class="page-title">Desconto (%)</h2>
                            <input type="number" name="desconto" id="desconto">
                        </div>
                    </div>
                    <!--Checkboxes-->
                    <div class="checkboxes campo">
                        <div class="emplacamento-field">
                            <h2 class="page-title">Emplacamento na loja (+R$150,00)</h2>
                            <form action="">
                                <input type="checkbox" name="emplacamento-checkbox" id="emplacamento-checkbox">
                            </form>
                        </div>
                        <div class="carro-usado-field">
                            <h2 class="page-title">Carro usado</h2>
                            <div class="campos-vus" id="campos-vus">
                                <input type="checkbox" name="" id="vu-checkbox">
                            </div>
                        </div>
                    </div>
                    <!--Registro de VUs-->
                    <div class="carro-usado-area" id="carro-usado-div"></div>
                </section>
                <!--Preco final-->
                <div class="final-value campo">
                    <h2 class="page-title">VALOR TOTAL</h2>
                    <p id="valor-final-field"></p>
                </div>
                <!--Campos de pagamento-->
                <section class="pagamento campo">
                    <h2 class="pagina-titulo">Pagamento</h2>
                    <div class="campos-pagamento">
                        <select name="" id="dropdown-financiamento">
                            <option value="A_VISTA">À vista</option>
                            <option value="FINANCIADO">Financiado</option>
                        </select>
                        <input type="email" id="cliente-email" placeholder="email@gmail.com">
                    </div>
                </section>
                <div class="bottom-buttons">
                    <a href="dados-cliente.html">
                        <button type="button" class="btn control-button" id="go-back-btn">
                            Voltar
                        </button>
                    </a>

                    <button class="btn control-button" id="dados-btn">
                        Enviar dados
                    </button>
                
                </div>
            </div>
        </main>
    </section>

    <script type="module" src="../scripts/atribuicao-venda.js"></script>
</body>
</html>
