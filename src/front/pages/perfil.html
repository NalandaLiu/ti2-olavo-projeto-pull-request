<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!--CSS do aside-->
    <link rel="stylesheet" href="../assets/css/aside.css">
    <link rel="stylesheet" href="../assets/css/buttons.css">
    <link rel="stylesheet" href="../assets/css/css_reset.css">
    <link rel="stylesheet" href="../assets/css/inputs.css">
    <link rel="stylesheet" href="../assets/css/tela.css">
    <link rel="stylesheet" href="../assets/css/perfilTemplate.css">
    <link rel="stylesheet" href="../assets/css/titulos.css">
    <link rel="stylesheet" href="../assets/css/buttons.css">
    <title>Perfil</title>
</head>
<body>
    <section class="tela">
        <aside class="sidebar">
            <a href="./perfil.html"><i class="fas fa-user icon"></i></a>
            <a href="./menu-vendas.html"><i class="fas fa-handshake icon"></i></a>
            <a href="./veiculos.html"><i class="fas fa-car icon"></i></a>
            <a href="./metricas.html"><i class="fa-solid fa-chart-line icon"></i></a>
        </aside>
        <main>
            <!--Topo da pagina-->
            <nav class="titulo-navegacao">
                <div class="pagina-titulo">
                    <h1 id="user-id"></h1>
                </div>
                <div class="senha-logout">
                    <!--<button class="btn"><h2>Trocar Senha</h2></button>-->
                    <button class="btn" id="logout"><h2>Logout</h2></button>
                </div>
            </nav>
            <!--Secao com detalhes do usuario-->
            <section class="detalhes-usuario">
                <div class="user-info">
                    <h3 class="user-info-title">Nome: </h3>
                    <input type="text" class="user-info-value" id="username" readonly>
                </div>
                <div class="user-info">
                    <h3 class="user-info-title">Sobrenome: </h3>
                    <input type="text" class="user-info-value" id="surname" readonly>
                </div>
                <div class="user-info">
                    <h3 class="user-info-title">CPF: </h3>
                    <input type="text" class="user-info-value" id="cpf" readonly>
                </div>
                <div class="user-info">
                    <h3 class="user-info-title">E-mail: </h3>
                    <input type="email" class="user-info-value" id="email" readonly>
                </div>
                <div class="user-info">
                    <h3 class="user-info-title">Cargo: </h3>
                    <input type="text" class="user-info-value" id="role" readonly>
                </div>
                <div class="user-info">
                    <h3 class="user-info-title">Salário: </h3>
                    <input type="text" class="user-info-value" id="salary" readonly>
                </div>
            </section>
            <!--<section class="btn control-button edicao-dados-usuario">Editar dados cadastrais</section>-->
            <!--Secao de tabela de funcionarios-->
            <section class="adicionar-funcionarios" id="tabela-funcionarios-section">
                <h2 title="funcionarios-title">Funcionários</h2>
                <table id="tabela-funcionarios">
                    <thead class="table-header table-row">
                        <td class="table-head-item">Matrícula</td>
                        <td class="table-head-item">Nome</td>
                        <td class="table-head-item">CPF</td>
                        <td class="table-head-item">Cargo</td>
                        <td class="table-head-item">Salário</td>
                        <td class="table-head-item"></td>
                    </thead>
                <!--
                    <tr class="table-row">
                        <td class="table-row-item" id="user-matricula">123</td>
                        <td class="table-row-item" id="user-nome">jao</td>
                        <td class="table-row-item" id="user-cpf">12345678900</td>
                        <td class="table-row-item" id="user-cargo">Vendedor</td>
                        <td class="table-row-item" id="user-cargo">15000</td>
                        <td class="table-row-item"><button class="btn control-button" data-bs-toggle="modal" data-bs-target="#modal-demissao">Demitir</button></td>
                    </tr>
                -->
                </table>
            </section>
        </main>
        
        <!--Modal de demissao-->
        <div class="modal fade" id="modal-demissao" tabindex="-1" aria-labelledby="demissao-funcionario" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class=" modal-title fs-5" id="modal-demissao-titulo">Demissão</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p id="modal-demissao-texto"></p>
                    </div>
                    <div class="botoes-modal modal-footer">
                        <button type="button" class="btn control-button" data-bs-dismiss="modal" id="confirmar-delecao">Sim</button>
                    <button type="button" class="btn control-button" data-bs-dismiss="modal">Não</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!--Botao de adicionar funcionario-->
        <button class="btn control-button" id="add-funcionario" data-bs-toggle="modal" data-bs-target="#modal-admissao">+</button>

        <!--Modal de adicionar funcionario-->
        <div class="modal fade" id="modal-admissao" tabindex="-1" aria-labelledby="admissao-funcionario" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" id="modal-admissao-conteudo">
                    <div class="modal-header">
                        <h1 class="modal-funcionario-titulo" id="modal-admissao-titulo">Registrar funcionário</h1>
                        
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    
                    </div>
                    <div class="modal-body">
                        <div class="dado-funcionario">
                            <h3 class="titulo-dado-funcionario">Nome: </h3>
                            <input type="text" class="input-dado-funcionario" placeholder="Ex. João" required id="input-nome-funcionario">
                        </div>
                        <div class="dado-funcionario">
                            <h3 class="titulo-dado-funcionario">Sobrenome: </h3>
                            <input type="text" class="input-dado-funcionario" placeholder="Ex. dos Santos" required id="input-sobrenome-funcionario">
                        </div>
                        <div class="dado-funcionario">
                            <h3 class="titulo-dado-funcionario">CPF: </h3>
                            <input type="number" class="input-dado-funcionario" placeholder="123.456.789-00" required id="input-cpf-funcionario">
                        </div>
                        <div class="dado-funcionario">
                            <h3 class="titulo-dado-funcionario">Cargo: </h3>
                            <select name="role" id="cargo" required>
                                <option value="VENDEDOR">Vendedor</option>
                                <option value="FINANCEIRO">Financeiro</option>
                                <option value="ADMIN">Gerente</option>
                            </select>
                        </div>
                        <div class="dado-funcionario">
                            <h3 class="titulo-dado-funcionario">Salário: </h3>
                            <input type="number" class="input-dado-funcionario" placeholder="R$ XXXXX,XX" required id="input-salario-funcionario">
                        </div>
                    </div>
                    <div class="botoes-modal modal-footer">
                        <button type="button" class="btn control-button" data-bs-dismiss="modal" id="confirmar-criacao">Registrar funcionário</button>
                    </div>
                </div>
            </div>
        </div>

    </section>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../scripts/perfil.js"></script>
</body>
</html>
