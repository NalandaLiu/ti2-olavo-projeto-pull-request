<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montagem do Veículo</title>
    <!-- Link para o Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/montagem.css">
    <!--CSS que configura a tela-->
    <link rel="stylesheet" href="../assets/css/tela.css">
    <!--CSS do aside-->
    <link rel="stylesheet" href="../assets/css/aside.css">
    <!--CSS dos botoes-->
    <link rel="stylesheet" href="../assets/css/buttons.css">
    <!--CSS dos inputs-->
    <link rel="stylesheet" href="../assets/css/inputs.css">
    <!--CSS dos titulos-->
    <link rel="stylesheet" href="../assets/css/titulos.css">
</head>
<body>
    <section class="tela">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <a href="./perfil.html"><i class="fas fa-user icon"></i></a>
            <a href="./menu-vendas.html"><i class="fas fa-handshake icon"></i></a>
            <a href="./veiculos.html"><i class="fas fa-car icon"></i></a>
            <a href="./metricas.html"><i class="fa-solid fa-chart-line icon"></i></a>
        </aside>
        <!-- Conteúdo Principal -->
        <main id="main">
            <h1 class="pagina-titulo">Montagem do Veículo</h1>

            <!-- Mensagem de Erro -->
            <div id="errorMessage" class="error-message" style="display: none;">
                <p>Não foi encontrado nenhum veículo com as especificações fornecidas</p>
                <h2>Aqui estão algumas recomendações</h2>
                <div class="recommendations" id="recommendations"></div>
            </div>

            <!-- Container de Carros -->
            <div id="carContainer" class="car-container"></div>

            <!--Botoes de voltar e ir para proxima pagina-->
            <section class="buttons">
                <a href="./menu-vendas.html">
                    <button class="control-button btn" id="go-back-btn">Voltar</button>
                </a>
                <!--
                <a href="./dados-cliente.html">
                    <button class="control-button btn">Dados do Cliente</button>
                </a>-->
            </section>
        </main>

        <!-- Painel de Filtro -->
        <div id="filterPanel" style="display: none;">
            <h2 class="pagina-titulo">Filtros</h2>
            <!--Campos-->
            <div class="mb-3">
                <label for="marca" class="form-label">Marca</label>
                <select class="form-select" id="marca" required>
                    <option value="" disabled selected>Selecione a marca</option>
                    <option value="audi">Audi</option>
                    <option value="bmw">BMW</option>
                    <option value="byd">BYD</option>
                    <option value="chevrolet">Chevrolet</option>
                    <option value="citroen">Citroën</option>
                    <option value="fiat">Fiat</option>
                    <option value="ford">Ford</option>
                    <option value="honda">Honda</option>
                    <option value="hyundai">Hyundai</option>
                    <option value="jeep">Jeep</option>
                    <option value="kia">Kia</option>
                    <option value="land-rover">Land Rover</option>
                    <option value="mercedes-benz">Mercedes-Benz</option>
                    <option value="mitsubishi">Mitsubishi</option>
                    <option value="nissan">Nissan</option>
                    <option value="peugeot">Peugeot</option>
                    <option value="porsche">Porsche</option>
                    <option value="renault">Renault</option>
                    <option value="toyota">Toyota</option>
                    <option value="volkswagen">Volkswagen</option>
                    <option value="volvo">Volvo</option>
                </select>
            </div>
            <div class="input-label">
                <label>Modelo</label>
                <input type="text" id="modeloInput">
            </div>
            <div class="input-label">
                <label>Estado</label>
                <select id="estadoInput">
                    <option value="">Selecione o Estado do Veiculo</option>
                    <option value="novo">Novo</option>
                    <option value="usado">Usado</option>
                </select>
            </div>
            <div class="input-label">
                <label>Ano</label>
                <input type="number" id="anoInput">
            </div>
            
            <div class="input-label">
                <label>Quilometragem</label>
                <input type="number" id="quilometragemInput">
            </div>
        
            <div class="mb-3">
                <label for="cor" class="form-label">Cor</label>
                <select class="form-select" id="cor" required>
                    <option value="" disabled selected>Selecione a cor</option>
                    <option value="preto">Preto</option>
                    <option value="branco">Branco</option>
                    <option value="prata">Prata</option>
                    <option value="vermelho">Vermelho</option>
                    <option value="cinza">Cinza</option>
                </select>
            </div>
            
            <button class="control-button btn aplicarFiltro">Aplicar</button>
            <button class="control-button btn cancelarFiltro">Cancelar</button>
        </div>

        <!-- Modal de Detalhes do Veículo -->
        <div id="carDetailsModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close" id="closeModalButton">&times;</span>
                <h2 class="title-detalhes">Detalhes do Veículo</h2>
                <h3 class="modal-title">Marca: </h3><span id="detailMarca" class=""></span>
                <h3 class="modal-title">Modelo: </h3><span id="detailModelo"></span>
                <h3 class="modal-title">Estado: </h3><span id="detailEstado"></span>
                <h3 class="modal-title">Ano: </h3><span id="detailAno"></span>
                <h3 class="modal-title">Quilometragem: </h3><span id="detailQuilometragem"></span>
                <h3 class="modal-title">Cor: </h3><span id="detailCor"></span></p>
            </div>
        </div>

        <!-- Botão de Pesquisa -->
        <button id="searchButton">
            <i class="fas fa-search"></i>
        </button>
    </section>

<!-- Script JavaScript -->
    <script type="module" src="../scripts/montagem.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
